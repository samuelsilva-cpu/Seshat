<svg viewBox="0 0 24 24" width="24" height="24" xmlns="http://www.w3.org/2000/svg" fill="currentColor">
  <!-- Cat head -->
  <rect x="5" y="8" width="14" height="10" rx="1"/>
  <!-- Left ear -->
  <polygon points="7,8 5,4 9,6"/>
  <!-- Right ear -->
  <polygon points="17,8 19,4 15,6"/>
  <!-- Left eye -->
  <rect x="8" y="10" width="2" height="2"/>
  <!-- Right eye -->
  <rect x="14" y="10" width="2" height="2"/>
  <!-- Nose -->
  <polygon points="12,13 11,14 13,14"/>
  <!-- Left whisker 1 -->
  <line x1="5" y1="12" x2="2" y2="11" stroke="currentColor" stroke-width="1" stroke-linecap="round"/>
  <!-- Left whisker 2 -->
  <line x1="5" y1="14" x2="2" y2="14" stroke="currentColor" stroke-width="1" stroke-linecap="round"/>
  <!-- Left whisker 3 -->
  <line x1="5" y1="16" x2="2" y2="17" stroke="currentColor" stroke-width="1" stroke-linecap="round"/>
  <!-- Right whisker 1 -->
  <line x1="19" y1="12" x2="22" y2="11" stroke="currentColor" stroke-width="1" stroke-linecap="round"/>
  <!-- Right whisker 2 -->
  <line x1="19" y1="14" x2="22" y2="14" stroke="currentColor" stroke-width="1" stroke-linecap="round"/>
  <!-- Right whisker 3 -->
  <line x1="19" y1="16" x2="22" y2="17" stroke="currentColor" stroke-width="1" stroke-linecap="round"/>
</svg>
