<svg viewBox="0 0 200 40" width="200" height="40" xmlns="http://www.w3.org/2000/svg" fill="currentColor">
  <!-- Icon: Cat -->
  <g transform="translate(0, 6)">
    <!-- Cat head -->
    <rect x="4" y="3" width="11" height="9" rx="1"/>
    <!-- Left ear -->
    <polygon points="6,3 3,0 8,2"/>
    <!-- Right ear -->
    <polygon points="15,3 18,0 13,2"/>
    <!-- Left eye -->
    <rect x="6" y="5" width="1.5" height="1.5"/>
    <!-- Right eye -->
    <rect x="11.5" y="5" width="1.5" height="1.5"/>
    <!-- Nose -->
    <polygon points="8.5,7 7.8,8 9.2,8"/>
    <!-- Left whiskers -->
    <line x1="4" y1="7" x2="1" y2="6.5" stroke="currentColor" stroke-width="0.8" stroke-linecap="round"/>
    <line x1="4" y1="9" x2="1" y2="9" stroke="currentColor" stroke-width="0.8" stroke-linecap="round"/>
    <line x1="4" y1="11" x2="1" y2="11.5" stroke="currentColor" stroke-width="0.8" stroke-linecap="round"/>
    <!-- Right whiskers -->
    <line x1="16" y1="7" x2="19" y2="6.5" stroke="currentColor" stroke-width="0.8" stroke-linecap="round"/>
    <line x1="16" y1="9" x2="19" y2="9" stroke="currentColor" stroke-width="0.8" stroke-linecap="round"/>
    <line x1="16" y1="11" x2="19" y2="11.5" stroke="currentColor" stroke-width="0.8" stroke-linecap="round"/>
  </g>

  <!-- Text: PLANK (pixel-art style as paths) -->
  <g transform="translate(30, 6)">
    <!-- P -->
    <path d="M 2 2 L 2 18 L 2 2 M 2 2 L 12 2 L 12 10 L 2 10" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- L -->
    <path d="M 20 2 L 20 18 L 20 18 L 30 18" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- A -->
    <path d="M 40 18 L 45 2 L 50 18 M 42 12 L 48 12" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- N -->
    <path d="M 58 18 L 58 2 L 70 18 L 70 2" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- K -->
    <path d="M 78 2 L 78 18 M 78 10 L 92 2 M 78 10 L 92 18" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
