<svg viewBox="0 0 32 32" width="32" height="32" xmlns="http://www.w3.org/2000/svg" fill="currentColor">
  <!-- Cat head -->
  <rect x="7" y="10" width="18" height="14" rx="1"/>
  <!-- Left ear -->
  <polygon points="9,10 6,5 11,8"/>
  <!-- Right ear -->
  <polygon points="23,10 26,5 21,8"/>
  <!-- Left eye -->
  <rect x="10" y="13" width="3" height="3"/>
  <!-- Right eye -->
  <rect x="19" y="13" width="3" height="3"/>
  <!-- Nose -->
  <polygon points="16,17 14,19 18,19"/>
  <!-- Left whisker 1 -->
  <line x1="7" y1="15" x2="2" y2="14" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Left whisker 2 -->
  <line x1="7" y1="17" x2="2" y2="17" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Left whisker 3 -->
  <line x1="7" y1="19" x2="2" y2="20" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Right whisker 1 -->
  <line x1="25" y1="15" x2="30" y2="14" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Right whisker 2 -->
  <line x1="25" y1="17" x2="30" y2="17" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Right whisker 3 -->
  <line x1="25" y1="19" x2="30" y2="20" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
</svg>
